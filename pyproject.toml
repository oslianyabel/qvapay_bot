[project]
name = "qvapay"
version = "0.1.0"
description = "Telegram bot for the documented QvaPay API endpoints"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pyjwt>=2.10",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]
